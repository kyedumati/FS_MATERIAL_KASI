<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="title-sync desc-sync">
  <title id="title-sync">GitHub is ahead of the laptop. Pull before you push.</title>
  <desc id="desc-sync">GitHub has a commit the laptop does not have. git pull copies it locally, then git push can send your new work.</desc>
  <defs>
    <marker id="arrow-sync" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="280" height="88" rx="12" fill="#fff5f5" stroke="#fda4af" stroke-width="2"/>
  <text x="160" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#9f1239">Your laptop</text>
  <text x="160" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#334155">notes, then your new commit</text>
  <text x="160" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#9f1239">missing Rohan's push</text>

  <rect x="420" y="20" width="280" height="88" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="560" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">GitHub</text>
  <text x="560" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#334155">notes + Rohan's payment</text>
  <text x="560" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#166534">ahead of you</text>

  <line x1="560" y1="108" x2="560" y2="128" stroke="#dc2626" stroke-width="3"/>
  <line x1="560" y1="128" x2="168" y2="128" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-sync)"/>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">git pull   then push your work</text>
</svg>
