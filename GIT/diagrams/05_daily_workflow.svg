<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title-daily desc-daily">
  <title id="title-daily">Daily Git: working folder, staging, local repo, GitHub</title>
  <desc id="desc-daily">git add moves chosen files to staging. git commit saves a checkpoint in the local repo. git push copies that history to GitHub. git pull copies GitHub history back to the laptop.</desc>
  <defs>
    <marker id="arrow-daily" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="300" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">On your laptop</text>
  <text x="786" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">GitHub</text>

  <rect x="16" y="44" width="148" height="52" rx="12" fill="#3b5bdb"/>
  <text x="90" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">working</text>
  <text x="90" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">folder</text>

  <rect x="220" y="44" width="148" height="52" rx="12" fill="#0c8599"/>
  <text x="294" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">staging</text>
  <text x="294" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">packing list</text>

  <rect x="424" y="44" width="148" height="52" rx="12" fill="#2f9e44"/>
  <text x="498" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">local repo</text>
  <text x="498" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#d3f9d8">checkpoints</text>

  <rect x="712" y="44" width="148" height="52" rx="12" fill="#f76707"/>
  <text x="786" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">GitHub</text>
  <text x="786" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff4e6">origin</text>

  <line x1="164" y1="70" x2="212" y2="70" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-daily)"/>
  <text x="188" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">add</text>

  <line x1="368" y1="70" x2="416" y2="70" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-daily)"/>
  <text x="392" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">commit</text>

  <line x1="572" y1="70" x2="704" y2="70" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-daily)"/>
  <text x="638" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">push</text>

  <line x1="786" y1="96" x2="786" y2="150" stroke="#dc2626" stroke-width="3"/>
  <line x1="786" y1="150" x2="498" y2="150" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-daily)"/>
  <text x="640" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">pull</text>

  <text x="90" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334155">You edit files</text>
  <text x="294" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334155">You choose files</text>
  <text x="498" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334155">History on this laptop</text>
  <text x="786" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334155">Shared copy</text>
</svg>
