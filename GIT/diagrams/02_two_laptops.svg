<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title-two desc-two">
  <title id="title-two">Two laptops copied together keep the wrong cart file</title>
  <desc id="desc-two">Aisha has login and an old cart. Rohan has payment and a new cart. Copying folders together can keep the wrong cart.</desc>
  <defs>
    <marker id="arrow-two" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="20" y="16" width="260" height="96" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="150" y="40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Aisha's laptop</text>
  <text x="150" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#166534">login — new</text>
  <text x="150" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9f1239">cart — old</text>

  <rect x="20" y="128" width="260" height="96" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="150" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Rohan's laptop</text>
  <text x="150" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#166534">cart — new</text>
  <text x="150" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#166534">payment — new</text>

  <line x1="280" y1="64" x2="404" y2="110" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-two)"/>
  <line x1="280" y1="176" x2="404" y2="130" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-two)"/>
  <text x="340" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">copy</text>

  <rect x="416" y="48" width="284" height="144" rx="12" fill="#fff5f5" stroke="#fda4af" stroke-width="2"/>
  <text x="558" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#9f1239">Combined folder</text>
  <text x="558" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#166534">login — kept</text>
  <text x="558" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#9f1239">cart — which one?</text>
  <text x="558" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#166534">payment — kept</text>
  <text x="558" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#be123c">Yesterday's cart may be gone</text>
</svg>
