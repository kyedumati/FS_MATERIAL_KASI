<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box model — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #fde68a; }  /* yellow = the margin area around the box */

      margin: 32px;
      border: 8px solid #1a365d;
      padding: 24px;
      background-color: #bfdbfe;     /* blue = padding + content */

  </style>
</head>
<body>
  <div class="box">Content: Ananya Rao, Engineering</div>
