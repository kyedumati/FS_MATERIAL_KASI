<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margin and padding — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    p { background-color: #bfdbfe; }
    .tight { padding: 0; margin: 0; }
    .roomy { padding: 16px; margin: 24px 0; }
    .sides { padding: 8px 32px; }
  </style>
</head>
<body>
  <p class="tight">padding: 0; margin: 0</p>
  <p class="roomy">padding: 16px; margin: 24px 0 (top and bottom 24px, left and right 0)</p>
  <p class="sides">padding: 8px 32px (top and bottom 8px, left and right 32px)</p>
</body>
</html>
