<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centering — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f4f6f8; }
    .card {
      max-width: 400px;
      margin: 24px auto;      /* auto left and right = centred */
      padding: 16px;
      background-color: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Ananya Rao</h2>
    <p>Never wider than 400px, always centred.</p>
  </div>
</body>
</html>
