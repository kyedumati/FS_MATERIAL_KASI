<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skip link — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { padding: 12px 24px; background-color: #1a365d; color: #ffffff; }
    header a { color: #ffffff; margin-right: 12px; }
    main { padding: 24px; }

    /* Off-screen until it receives keyboard focus */
    .skip-link {
      position: absolute;
      left: 8px;
      top: -48px;
      padding: 8px 12px;
      background-color: #ffffff;
      color: #1a365d;
      font-weight: bold;
    }
    .skip-link:focus {
      top: 8px;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <a href="#">Dashboard</a>
    <a href="#">Directory</a>
    <a href="#">Leave</a>
    <a href="#">Reports</a>
  </header>
  <main id="main">
    <h1>HR dashboard</h1>
    <p>Keyboard users can jump straight here.</p>
  </main>
</body>
</html>
