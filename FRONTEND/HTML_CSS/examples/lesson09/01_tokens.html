<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design tokens — AcmeHR</title>
  <style>
    :root {
      --color-brand: #1a365d;
      --color-ink: #1b2430;
      --color-muted: #3d4654;
      --color-surface: #ffffff;
      --color-border: #d0d7de;
      --color-focus: #ea580c;
      --space-2: 8px;
      --space-4: 16px;
      --radius: 8px;
    }
    body { font-family: system-ui, sans-serif; color: var(--color-ink); }
    .card {
      max-width: 320px;
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-top: 4px solid var(--color-brand);
      border-radius: var(--radius);
    }
    .card h2 { margin: 0 0 var(--space-2); color: var(--color-brand); font-size: 1.125rem; }
    .card p { margin: 0; color: var(--color-muted); }

    /* Change one token for one section: every rule that uses it follows */
    .theme-finance { --color-brand: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Engineering</h2>
    <p>112 employees</p>
  </div>
  <div class="card theme-finance">
    <h2>Finance</h2>
    <p>26 employees</p>
  </div>
</body>
</html>
