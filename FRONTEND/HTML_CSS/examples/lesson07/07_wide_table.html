<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wide table — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    table { border-collapse: collapse; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #d0d7de; text-align: left; }
  </style>
</head>
<body>
  <h1>Weekly attendance</h1>
    <table>
      <caption>Attendance, week of 5 October 2026</caption>
      <thead>
        <tr>
          <th scope="col">Employee</th>
          <th scope="col">Mon</th><th scope="col">Tue</th><th scope="col">Wed</th>
          <th scope="col">Thu</th><th scope="col">Fri</th><th scope="col">Hours</th>
        </tr>
      </thead>
      <tbody>
        <tr><th scope="row">Ananya Rao</th><td>09:02–18:10</td><td>09:00–18:05</td><td>08:58–18:00</td><td>09:05–18:20</td><td>09:01–17:45</td><td>45.6</td></tr>
        <tr><th scope="row">Karthik Menon</th><td>09:41–18:30</td><td>09:30–18:30</td><td>On leave</td><td>09:28–18:35</td><td>09:33–18:30</td><td>36.0</td></tr>
      </tbody>
    </table>
  <p>The whole page now scrolls sideways.</p>
</body>
</html>
