<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    td { border: 1px solid #1a365d; padding: 4px 8px; }
    .separate { border-collapse: separate; }
    .collapse { border-collapse: collapse; }
  </style>
</head>
<body>
  <p>border-collapse: separate (default)</p>
  <table class="separate"><tr><td>09:02</td><td>18:10</td></tr><tr><td>09:41</td><td>18:30</td></tr></table>
  <p>border-collapse: collapse</p>
  <table class="collapse"><tr><td>09:02</td><td>18:10</td></tr><tr><td>09:41</td><td>18:30</td></tr></table>
</body>
</html>
