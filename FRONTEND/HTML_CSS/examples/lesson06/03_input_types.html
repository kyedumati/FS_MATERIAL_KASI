<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input types — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    p { margin: 0 0 12px; }
    label { display: inline-block; width: 140px; }
  </style>
</head>
<body>
  <p><label for="t-text">text</label> <input type="text" id="t-text" name="name"></p>
  <p><label for="t-email">email</label> <input type="email" id="t-email" name="email"></p>
  <p><label for="t-tel">tel</label> <input type="tel" id="t-tel" name="phone"></p>
  <p><label for="t-date">date</label> <input type="date" id="t-date" name="from_date"></p>
  <p><label for="t-number">number</label> <input type="number" id="t-number" name="days" min="1" max="30" value="2"></p>
  <p><label for="t-password">password</label> <input type="password" id="t-password" name="password" value="secret12"></p>
  <p><label for="t-file">file</label> <input type="file" id="t-file" name="document"></p>
</body>
</html>
