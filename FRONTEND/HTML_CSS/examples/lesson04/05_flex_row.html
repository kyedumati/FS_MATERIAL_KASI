<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex header — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header {
      display: flex;
      background-color: #1a365d;
      color: #ffffff;
    }
    header p { margin: 0; padding: 12px 24px; font-weight: bold; }
    nav ul {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    nav a {
      display: block;
      padding: 12px;
      color: #ffffff;
      text-decoration: none;   /* no underline */
    }
  </style>
</head>
<body>
  <header>
    <p>AcmeHR</p>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Profile</a></li>
        <li><a href="#">Directory</a></li>
        <li><a href="#">Leave</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
