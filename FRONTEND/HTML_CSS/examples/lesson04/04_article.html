<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee card — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 16px; max-width: 320px; }
    .card h2 { margin: 8px 0 0; font-size: 1.125rem; }
    .card p { margin: 0; }
  </style>
</head>
<body>
  <article class="card">
    <img src="images/ananya-rao.png" alt="" width="64" height="64">
    <h2>Ananya Rao</h2>
    <p>Senior Software Engineer</p>
    <p>Engineering · Hyderabad</p>
  </article>
</body>
</html>
