<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed and flexible — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 16px;
    }
    .layout div { padding: 16px; background-color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="layout">
    <div>200px — menu</div>
    <div>1fr — takes all the remaining width</div>
  </div>
</body>
</html>
