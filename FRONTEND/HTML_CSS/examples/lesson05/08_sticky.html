<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky header — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header {
      position: sticky;
      top: 0;
      padding: 12px 24px;
      background-color: #1a365d;
      color: #ffffff;
      font-weight: bold;
    }
    section { padding: 16px 24px; border-bottom: 1px solid #d0d7de; height: 240px; }
  </style>
</head>
<body>
  <header>AcmeHR — this header sticks to the top</header>
  <section><h2>Headcount</h2><p>248 employees.</p></section>
  <section><h2>Leave</h2><p>12 employees on leave today.</p></section>
  <section><h2>Attendance</h2><p>5 late arrivals today.</p></section>
  <section><h2>Attrition</h2><p>8.4% in the last 12 months.</p></section>
</body>
</html>
