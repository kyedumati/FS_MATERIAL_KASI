<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge — AcmeHR</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    .tile { padding: 16px; background-color: #ffffff; border: 1px solid #d0d7de; border-radius: 8px; }
    .tile p { margin: 0; }
    .number { font-size: 1.75rem; font-weight: bold; color: #1a365d; }
    .tile {
      position: relative;        /* the badge is placed inside this box */
      max-width: 260px;
    }
    .badge {
      position: absolute;
      top: -8px;
      right: -8px;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: #dc2626;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <p>The badge hangs off the top-right corner of the tile.</p>
  <div class="tile">
    <span class="badge">3 new</span>
    <p>Open leave requests</p>
    <p class="number">7</p>
  </div>
</body>
</html>
